<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꧁꫞神☬圣꫞꧂の群聊</title>
<style>
:root{
  --bg:#191919;
  --bar:#1f1f1f;
  --bar-line:rgba(255,255,255,.07);
  --bubble-them:#2b2b2e;
  --bubble-me:#4bd964;
  --ink:#e9e9e9;
  --ink-dim:#8b8b8b;
  --ink-faint:#666;
  --send:#4bd964;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── 顶栏 ── */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:14px 18px 12px;background:var(--bar);
  border-bottom:1px solid var(--bar-line);
}
.back{color:var(--ink-dim);font-size:24px;line-height:1;margin-right:2px;user-select:none;opacity:.8}
.head-main{flex:1;min-width:0}
.title{font-size:17px;font-weight:600;letter-spacing:.2px}
.title .cnt{color:var(--ink-dim);font-weight:400;font-size:14px;margin-left:2px}
.head-icons{display:flex;gap:18px;color:var(--ink-dim);font-size:19px;user-select:none}
.head-icons span{cursor:default;opacity:.85}

/* ── 成员条 ── */
.chips{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:9px 14px;background:var(--bar);
  border-bottom:1px solid var(--bar-line);
  overflow-x:auto;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chips .lab{color:var(--ink-faint);font-size:12px;flex:0 0 auto;margin-right:2px}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:4px 10px 4px 5px;border-radius:14px;
  background:rgba(255,255,255,.05);color:var(--ink-dim);
  font-size:12.5px;cursor:pointer;user-select:none;
  border:1px solid transparent;transition:.14s;
}
.chip .dot{
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;overflow:hidden;
  font-size:10.5px;font-weight:600;color:#fff;background:var(--c);opacity:.45;
}
.chip .dot.has-img{opacity:.72}
.chip.on .dot.has-img{opacity:1}
.chip .dot img{width:100%;height:100%;object-fit:cover;display:block}
.chip.on{background:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(255,255,255,.13)}
.chip.on .dot{opacity:1}
.chip.pinged{border-color:rgba(255,196,80,.8);background:rgba(255,196,80,.14)}
.chip.speaking{border-color:rgba(75,217,100,.45)}
.chip.speaking::after{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--send);
  animation:blink 1.1s infinite;margin-left:1px;
}
.chip.all{background:transparent;border:0;padding:4px 8px;color:var(--ink-faint)}
.chip.all:hover{color:var(--ink)}
.freezug{
  flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--ink-dim);cursor:pointer;user-select:none;padding-left:10px;
}
.freezug .box{
  width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.13);position:relative;transition:.16s;
}
.freezug .box::after{
  content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#9a9a9a;transition:.16s;
}
.freezug.on{color:var(--send)}
.freezug.on .box{background:rgba(75,217,100,.32)}
.freezug.on .box::after{left:13px;background:var(--send)}

/* ── 消息流 ── */
main{
  flex:1 1 auto;overflow-y:auto;padding:18px 18px 8px;
  scroll-behavior:smooth;
}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

.time{
  text-align:center;color:var(--ink-faint);font-size:12px;
  margin:20px 0 16px;user-select:none;
}
.row{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start}
.row.me{flex-direction:row-reverse}

.avatar{
  flex:0 0 auto;width:38px;height:38px;border-radius:7px;
  display:grid;place-items:center;font-size:15px;font-weight:600;color:#fff;
  background:var(--c,#444);user-select:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.10);
}
.avatar.me-avatar{background:#3a3a3e;color:#d3d3d6}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.body{min-width:0;max-width:min(72%,620px);display:flex;flex-direction:column}
.row.me .body{align-items:flex-end}
.who{
  font-size:12px;color:var(--ink-dim);margin:0 0 5px 2px;line-height:1;
}
.bubble{
  padding:9px 13px;border-radius:6px;background:var(--bubble-them);
  white-space:pre-wrap;word-break:break-word;position:relative;
  font-size:15px;line-height:1.55;
}
.row.me .bubble{background:var(--bubble-me);color:#12301c}
.row.me .bubble a{color:#0b3a1c}
.bubble.typing{color:var(--ink-dim)}
.bubble.img-bubble{padding:4px;display:flex;flex-wrap:wrap;gap:4px;max-width:330px}
.bubble.img-bubble img{display:block;max-width:150px;max-height:150px;border-radius:5px;object-fit:cover;cursor:zoom-in}
.bubble.img-bubble.one img{max-width:300px;max-height:340px}
.bubble .cap{width:100%;padding:5px 7px 3px;font-size:14.5px;line-height:1.5}
.bubble .dots{display:inline-flex;gap:4px;align-items:center;height:1.2em}
.bubble .dots i{
  width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;
  animation:blink 1.15s infinite;
}
.bubble .dots i:nth-child(2){animation-delay:.18s}
.bubble .dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.22;transform:translateY(0)}30%{opacity:.85;transform:translateY(-2px)}}

/* ── 输入区 ── */
footer{
  flex:0 0 auto;background:var(--bar);border-top:1px solid var(--bar-line);
  padding:10px 14px 12px;
}
.tools{display:flex;align-items:center;gap:16px;color:var(--ink-dim);font-size:19px;padding:2px 2px 8px;user-select:none}
.tools span{opacity:.62;display:flex;align-items:center;cursor:pointer;transition:.14s}
.tools span:hover{opacity:1}
.tools .ico{width:21px;height:21px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools .flex{flex:1}
/* 待发送的图片 */
.pending{display:none;gap:8px;padding:2px 0 8px;flex-wrap:wrap}
.pending.on{display:flex}
.pending .thumb{position:relative;width:58px;height:58px;border-radius:7px;overflow:hidden;background:#262628}
.pending .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pending .thumb .x{
  position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;font-size:10px;display:grid;place-items:center;
  cursor:pointer;line-height:1;
}
.inputline{display:flex;align-items:flex-end;gap:10px}
textarea{
  flex:1;resize:none;background:#262628;color:var(--ink);
  border:1px solid rgba(255,255,255,.06);border-radius:8px;
  padding:9px 12px;font:inherit;font-size:15px;line-height:1.45;
  max-height:132px;outline:none;
}
textarea::placeholder{color:var(--ink-faint)}
textarea:focus{border-color:rgba(255,255,255,.14)}
#send{
  background:var(--send);color:#0e2a15;border:0;border-radius:8px;
  padding:9px 18px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:.14s;flex:0 0 auto;
}
#send:hover{filter:brightness(1.06)}
#send:disabled{background:#2e2e30;color:#666;cursor:default}
.hint{padding:6px 4px 0;color:var(--ink-faint);font-size:11.5px}
.subtitle{font-size:11.5px;color:var(--ink-faint);margin-top:1px;line-height:1.2}

/* 顶栏下拉菜单 */
.menu{
  position:fixed;top:56px;right:14px;z-index:60;display:none;
  background:#2a2a2d;border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:5px;min-width:158px;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.menu.open{display:block}
.menu-item{padding:8px 12px;border-radius:6px;font-size:13.5px;color:var(--ink);cursor:pointer}
.menu-item:hover{background:rgba(255,255,255,.08)}
.menu-item.sep{border-top:1px solid rgba(255,255,255,.07);margin-top:4px;padding-top:10px}

/* 历史会话抽屉 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none}
.mask.open{display:block}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:302px;z-index:80;display:flex;flex-direction:column;
  background:#202022;border-right:1px solid rgba(255,255,255,.07);
  transform:translateX(-102%);transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 16px 12px;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);
}
.drawer-head .x{color:var(--ink-dim);cursor:pointer;font-size:14px}
.drawer-list{flex:1;overflow-y:auto;padding:8px}
.drawer-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.drawer-item:hover{background:rgba(255,255,255,.07)}
.drawer-item .d1{font-size:13.5px;color:var(--ink);margin-bottom:3px}
.drawer-item .d2{font-size:11.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-item.cur{border-color:rgba(75,217,100,.35);background:rgba(75,217,100,.06)}
.drawer-foot{padding:10px 14px 16px;font-size:11px;color:var(--ink-faint);border-top:1px solid rgba(255,255,255,.06)}

/* 表情面板 */
.emoji-panel{
  position:fixed;left:14px;bottom:104px;z-index:65;display:none;
  background:#2a2a2d;border:1px solid rgba(255,255,255,.08);border-radius:10px;
  padding:8px;width:320px;box-shadow:0 12px 32px rgba(0,0,0,.5);
}
.emoji-panel.open{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:1px}
.emoji-grid span{font-size:19px;text-align:center;padding:3px 0;border-radius:6px;cursor:pointer;line-height:1.25;user-select:none}
.emoji-grid span:hover{background:rgba(255,255,255,.1)}

/* 小提示 */
.toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(8px);
  background:#343437;color:#eee;padding:9px 16px;border-radius:8px;font-size:13px;
  opacity:0;transition:.22s;z-index:90;pointer-events:none;white-space:pre-line;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 拖图进来时的全屏提示 */
.drop-hint{
  position:fixed;inset:0;z-index:95;display:none;pointer-events:none;
  background:rgba(20,20,20,.82);align-items:center;justify-content:center;
}
body.dragging .drop-hint{display:flex}
.drop-hint .box{
  border:2px dashed rgba(75,217,100,.55);border-radius:16px;padding:28px 46px;
  color:var(--ink);font-size:15.5px;background:rgba(75,217,100,.06);
}
</style>
</head>
<body>

<header>
  <div class="back" id="backBtn" title="历史会话">‹</div>
  <div class="head-main">
    <div class="title">꧁꫞神☬圣꫞꧂の群聊 <span class="cnt" id="cnt">(6)</span></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="head-icons"><span id="moreBtn" title="更多">⋯</span></div>
</header>

<!-- 右上角菜单 -->
<div class="menu" id="menu">
  <div class="menu-item" data-act="export">导出这段记录</div>
  <div class="menu-item" data-act="info">会话信息</div>
  <div class="menu-item sep" data-act="new">开新会话</div>
</div>

<!-- 历史会话抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span>历史会话</span><span class="x" id="drawerClose">✕</span>
  </div>
  <div class="drawer-list" id="drawerList"></div>
  <div class="drawer-foot">点一段就跳回去，原来那段会收进抽屉里</div>
</aside>

<div class="chips" id="chips">
  <span class="lab">发言</span>
  <div class="chip all" id="chipAll">全选</div>
  <div class="freezug" id="freezug" title="一轮之后姐妹们自己再聊一轮">
    <span class="box"></span><span>自由讨论</span>
  </div>
</div>

<main id="feed"></main>

<div class="drop-hint" id="dropHint"><div class="box">松手就发出去</div></div>

<footer>
  <div class="emoji-panel" id="emojiPanel">
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>
  <div class="tools">
    <span id="emojiBtn" title="表情">☺</span>
    <span id="imgBtn" title="发图片（也可拖进来或直接粘贴）">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7.2c0-1.1.9-2 2-2h3.5c.55 0 1.07.22 1.45.62L11.4 7.3H19c1.1 0 2 .9 2 2v7.5c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2z"/>
      </svg>
    </span>
  </div>
  <div class="pending" id="pendingBar"></div>
  <div class="inputline">
    <textarea id="input" rows="1" placeholder="说点什么…（@GLM 只叫一个人）"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · /new 开新会话 · 六位同时开麦，谁先说完整句谁先上屏</div>
</footer>

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const chips = document.getElementById('chips');
const chipAll = document.getElementById('chipAll');
const freezug = document.getElementById('freezug');
const cnt = document.getElementById('cnt');

let SISTERS = [];
let ME = 'deepseek';
let OWNER = '主人';
let selected = new Set();
const nodes = new Map();     // msg id -> bubble element
let lastTs = 0;

/* ── 工具 ── */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts){
  const d = new Date(ts * 1000);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yst = new Date(now); yst.setDate(now.getDate() - 1);
  const isYst = d.toDateString() === yst.toDateString();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return hm;
  if (isYst) return '昨天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}
function sisterOf(id){ return SISTERS.find(s => s.id === id); }
function nearBottom(){
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
}
function toBottom(){ feed.scrollTop = feed.scrollHeight; }

/* ── 渲染 ── */
function addTime(ts){
  const el = document.createElement('div');
  el.className = 'time';
  el.textContent = fmtTime(ts);
  feed.appendChild(el);
}

function addMessage(m){
  if (m.ts - lastTs > 300) addTime(m.ts);
  lastTs = Math.max(lastTs, m.ts);

  const row = document.createElement('div');
  if (m.from === 'owner') {
    row.className = 'row me';
    row.innerHTML =
      '<div class="avatar me-avatar">主</div>' +
      '<div class="body"><div class="bubble"></div></div>';
  } else {
    const s = sisterOf(m.from) || {name: m.from, color: '#555', glyph: '?'};
    row.className = 'row';
    const face = s.avatar
      ? '<img src="/avatars/' + s.avatar + '.png" alt="">'
      : esc(s.glyph);
    row.innerHTML =
      '<div class="avatar" style="--c:' + s.color + '">' + face + '</div>' +
      '<div class="body"><div class="who"></div><div class="bubble"></div></div>';
    row.querySelector('.who').textContent = s.name;
  }
  const bubble = row.querySelector('.bubble');
  const imgs = m.images || (m.image ? [m.image] : []);
  if (imgs.length) {
    bubble.classList.add('img-bubble');
    if (imgs.length === 1) bubble.classList.add('one');
    imgs.forEach(fn => {
      const im = document.createElement('img');
      im.src = '/images/' + fn;
      im.alt = '';
      im.onload = () => { if (nearBottom()) toBottom(); };
      im.onclick = () => window.open(im.src, '_blank');
      bubble.appendChild(im);
    });
    if (m.text) {
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = m.text;
      bubble.appendChild(cap);
    }
    nodes.set(m.id, bubble);
    feed.appendChild(row);
    return;
  } else if (m.text) {
    bubble.textContent = m.text;
  } else {
    bubble.classList.add('typing');
    bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  }
  nodes.set(m.id, bubble);
  feed.appendChild(row);
  toBottom();
}

function onDelta(id, text){
  const b = nodes.get(id);
  if (!b) return;
  const stick = nearBottom();
  if (b.classList.contains('typing')) {
    b.classList.remove('typing');
    b.textContent = '';
  }
  b.textContent += text;
  if (stick) toBottom();
}

function flashChip(sid){          // 有人被 @ 点名，亮一下
  const chip = document.querySelector('.chip[data-id="' + sid + '"]');
  if (!chip) return;
  chip.classList.add('pinged');
  setTimeout(() => chip.classList.remove('pinged'), 1700);
}

function setTyping(sid, on){
  const chip = document.querySelector('.chip[data-id="' + sid + '"]');
  if (chip) chip.classList.toggle('speaking', !!on);
}

async function reloadFeed(note){
  const st = await (await fetch('/api/state')).json();
  SISTERS = st.sisters;
  feed.innerHTML = '';
  nodes.clear();
  lastTs = 0;
  st.messages.forEach(addMessage);
  if (!st.messages.length) {
    const el = document.createElement('div');
    el.className = 'time';
    el.style.marginTop = '40px';
    el.textContent = note || '空的 · 说句话试试';
    feed.appendChild(el);
  }
  updateSubtitle(st);
  toBottom();
}

function onFinal(id, text){
  const b = nodes.get(id);
  if (!b) return;
  const stick = nearBottom();
  b.classList.remove('typing');
  b.textContent = text || '（沉默）';
  if (stick) toBottom();
}

/* ── 成员条 ── */
function renderChips(){
  SISTERS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'chip on';
    el.dataset.id = s.id;
    const mini = s.avatar
      ? '<span class="dot has-img"><img src="/avatars/' + s.avatar + '.png" alt=""></span>'
      : '<span class="dot" style="--c:' + s.color + '">' + esc(s.glyph) + '</span>';
    el.innerHTML = mini + '<span>' + esc(s.name) + '</span>';
    el.onclick = () => {
      el.classList.toggle('on');
      if (el.classList.contains('on')) selected.add(s.id); else selected.delete(s.id);
      syncAll();
    };
    chips.insertBefore(el, freezug);
    selected.add(s.id);
  });
  cnt.textContent = '(' + SISTERS.length + ')';
}
function syncAll(){
  chipAll.textContent = selected.size === SISTERS.length ? '全不选' : '全选';
}
chipAll.onclick = () => {
  const all = selected.size === SISTERS.length;
  document.querySelectorAll('.chip[data-id]').forEach(el => {
    el.classList.toggle('on', !all);
  });
  selected = all ? new Set() : new Set(SISTERS.map(s => s.id));
  syncAll();
};
freezug.onclick = () => freezug.classList.toggle('on');

/* ── 发送 ── */
async function send(){
  const text = input.value.trim();
  if (!text && !pending.length) return;      // 没字也没图，没什么好发的

  if (text === '/new') {                     // 开新会话：归档记录 + 换一脑袋
    input.value = '';
    input.style.height = 'auto';
    try { await fetch('/api/new', { method: 'POST' }); } catch (e) { console.error(e); }
    return;
  }

  if (selected.size === 0) {
    input.placeholder = '先选一位姐妹吧…';
    setTimeout(() => input.placeholder = '说点什么…（@GLM 只叫一个人）', 1600);
    return;
  }

  sendBtn.disabled = true;

  // 先把排队的图全传上去，拿到文件名
  let images = [];
  if (pending.length) {
    toast('传图中…');
    try {
      images = await uploadPending();
    } catch (e) {
      toast(e.message || '上传失败');
      sendBtn.disabled = false;
      return;
    }
  }

  const sentText = text;
  input.value = '';
  input.style.height = 'auto';
  pending.forEach(p => URL.revokeObjectURL(p.url));
  pending = [];
  renderPending();

  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text: sentText,
        images,
        targets: SISTERS.map(s => s.id).filter(id => selected.has(id)),
        freeflow: freezug.classList.contains('on') ? 1 : 0
      })
    });
  } catch (e) {
    console.error(e);
  }
  setTimeout(() => sendBtn.disabled = false, 300);
}
sendBtn.onclick = send;

/* 中文输入法：选词那一下的 Enter 不能当发送。
   macOS 上顺序是 compositionend → keydown，而 Chrome 此时 isComposing 已经变回 false，
   光靠 isComposing 拦不住，所以再加一道「刚结束组词的时间窗」。 */
let composing = false;
let compEndAt = 0;
input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend', () => {
  composing = false;
  compEndAt = Date.now();
});
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (composing || e.isComposing || e.keyCode === 229) return;   // 还在组词
  if (Date.now() - compEndAt < 120) return;                       // 刚选完词那一下
  e.preventDefault();
  send();
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
});


/* ══ 表情面板 ══ */

                '😘','😏','😒','🙄','😴','🥱','😪','😮','😲','🤔',
                '😅','😭','😤','😡','🫠','🥲','😇','🤗','🤭','😶',
                '👍','👎','👏','🙏','🤝','💪','✌️','🫶','👋','🫡',
                '❤️','💚','💙','💛','💜','🖤','🤍','💔','💯','✨',
                '🔥','💧','🌊','🐳','🐋','🦊','🐰','🐱','🐟','🍀',
                '🍣','🍰','☕','🎉','🎊','🌸','🌙','⭐','☀️','❓'];

EMOJIS.forEach(e => {

document.getElementById('emojiBtn').onclick = ev => {
  ev.stopPropagation();

};

function insertAtCursor(el, text){
  const a = el.selectionStart == null ? el.value.length : el.selectionStart;
  const b = el.selectionEnd == null ? el.value.length : el.selectionEnd;
  el.value = el.value.slice(0, a) + text + el.value.slice(b);
  el.selectionStart = el.selectionEnd = a + text.length;
  el.dispatchEvent(new Event('input', {bubbles: true}));
}

/* ══ 发图片 ══ */
const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

document.getElementById('imgBtn').onclick = ev => {
  ev.stopPropagation();
  emojiPanel.classList.remove('open');
  fileInput.click();
};
/* 待发的图片先排队，等 Enter 才一起走 */
let pending = [];          // [{file, url}]

function addPending(f){
  if (!f) return;
  if (!f.type || !f.type.startsWith('image/')) { toast('这个不是图片'); return; }
  if (f.size > 12 * 1024 * 1024) { toast('图太大了（上限 12MB）'); return; }
  if (pending.length >= 9) { toast('一次最多 9 张'); return; }
  pending.push({file: f, url: URL.createObjectURL(f)});
  renderPending();
  input.focus();
}

function renderPending(){
  const bar = document.getElementById('pendingBar');
  bar.innerHTML = '';
  if (!pending.length) { bar.classList.remove('on'); return; }
  bar.classList.add('on');
  pending.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const im = document.createElement('img');
    im.src = p.url;
    im.alt = '';
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '✕';
    x.onclick = ev => {
      ev.stopPropagation();
      URL.revokeObjectURL(p.url);
      pending.splice(i, 1);
      renderPending();
    };
    d.appendChild(im);
    d.appendChild(x);
    bar.appendChild(d);
  });
}

async function uploadPending(){
  const names = [];
  for (const p of pending) {
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('读不了这张图'));
      r.readAsDataURL(p.file);
    });
    const r = await fetch('/api/upload', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data: dataUrl, name: p.file.name || 'pasted.png'})
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || '上传失败');
    }
    names.push((await r.json()).file);
  }
  return names;
}

fileInput.multiple = true;
fileInput.onchange = () => {
  Array.from(fileInput.files || []).forEach(addPending);
  fileInput.value = '';
};

/* ── 拖进来就发 ── */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  const types = e.dataTransfer && e.dataTransfer.types;
  if (!types || !Array.from(types).includes('Files')) return;
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragover', e => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault();
});
window.addEventListener('dragleave', e => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove('dragging');
});
window.addEventListener('drop', e => {
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if (!files.length) return;
  e.preventDefault();
  const imgs = files.filter(f => f.type && f.type.startsWith('image/'));
  if (imgs.length) imgs.forEach(addPending);
  else toast('只认图片哦');
});

/* ── 剪贴板粘贴图片 ── */
document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) { e.preventDefault(); addPending(f); return; }
    }
  }
});

/* ══ 小提示 ══ */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 260); }, 2200);
}

/* ══ 顶栏小字 ══ */
function updateSubtitle(st){
  const el = document.getElementById('subtitle');
  if (!el || !st) return;
  el.textContent = (st.session || '') + ' · ' + (st.messages || []).length + ' 条';
}

/* ══ 右上角菜单 ══ */
const menuEl = document.getElementById('menu');
document.getElementById('moreBtn').onclick = ev => {
  ev.stopPropagation();
  emojiPanel.classList.remove('open');
  menuEl.classList.toggle('open');
};
menuEl.querySelectorAll('.menu-item').forEach(el => {
  el.onclick = async ev => {
    ev.stopPropagation();
    menuEl.classList.remove('open');
    const act = el.dataset.act;
    if (act === 'export') {
      const r = await fetch('/api/export');
      if (!r.ok) { toast('这段还是空的'); return; }
      const txt = await r.text();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], {type: 'text/markdown;charset=utf-8'}));
      a.download = '姐妹群-' + new Date().toISOString().slice(0, 10) + '.md';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('已导出 markdown');
    } else if (act === 'new') {
      await fetch('/api/new', {method: 'POST'});
    } else if (act === 'info') {
      const st = await (await fetch('/api/state')).json();
      toast('会话：' + st.session + '\n消息：' + st.messages.length + ' 条\n成员：' + st.sisters.length + ' 位');
    }
  };
});

/* ══ 历史会话抽屉 ══ */
const maskEl = document.getElementById('mask');
const drawerEl = document.getElementById('drawer');

function fmtDay(ts){
  const d = new Date(ts * 1000), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

async function openDrawer(){
  const d = await (await fetch('/api/history')).json();
  const list = document.getElementById('drawerList');
  list.innerHTML = '';

  const cur = document.createElement('div');
  cur.className = 'drawer-item cur';
  cur.innerHTML = '<div class="d1"></div><div class="d2">正在聊的这段</div>';
  cur.querySelector('.d1').textContent = '当前 · ' + (d.current || '');
  list.appendChild(cur);

  if (!d.items.length) {
    const empty = document.createElement('div');
    empty.className = 'drawer-foot';
    empty.textContent = '还没有收起来的旧会话';
    list.appendChild(empty);
  }
  d.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'drawer-item';
    el.innerHTML = '<div class="d1"></div><div class="d2"></div>';
    el.querySelector('.d1').textContent = fmtDay(it.end) + ' · ' + it.count + ' 条';
    el.querySelector('.d2').textContent = it.preview || '（空）';
    el.onclick = ev => { ev.stopPropagation(); switchTo(it.file); };
    list.appendChild(el);
  });

  drawerEl.classList.add('open');
  maskEl.classList.add('open');
}
function closeDrawer(){
  drawerEl.classList.remove('open');
  maskEl.classList.remove('open');
}
async function switchTo(file){
  closeDrawer();
  const r = await fetch('/api/switch', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({file})
  });
  if (!r.ok) { toast('这段打不开了'); return; }
  toast('回到那段了');
}
document.getElementById('backBtn').onclick = ev => { ev.stopPropagation(); openDrawer(); };
document.getElementById('drawerClose').onclick = ev => { ev.stopPropagation(); closeDrawer(); };
maskEl.onclick = closeDrawer;

/* 点空白处收摊 */
document.addEventListener('click', () => {
  menuEl.classList.remove('open');
  emojiPanel.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    menuEl.classList.remove('open');
    emojiPanel.classList.remove('open');
    closeDrawer();
  }
});

/* ── 启动 ── */
async function boot(){
  const r = await fetch('/api/state');
  const st = await r.json();
  SISTERS = st.sisters;
  ME = st.me;
  OWNER = st.owner;
  renderChips();
  updateSubtitle(st);
  st.messages.forEach(addMessage);
  if (st.messages.length === 0) {
    addTime(Date.now() / 1000);
    const hello = document.createElement('div');
    hello.className = 'time';
    hello.style.marginTop = '40px';
    hello.textContent = '群已建好 · 说句话试试';
    feed.appendChild(hello);
  }
  toBottom();

  const es = new EventSource('/events');
  es.onmessage = ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'msg') addMessage(d.msg);
    else if (d.type === 'delta') onDelta(d.id, d.text);
    else if (d.type === 'final') onFinal(d.id, d.text);
    else if (d.type === 'typing') setTyping(d.who, d.on);
    else if (d.type === 'relay') flashChip(d.to);
    else if (d.type === 'reset') reloadFeed('已开新会话 · ' + (d.session || ''));
    else if (d.type === 'reload') reloadFeed();
    else if (d.type === 'error') console.warn('server:', d.text);
  };
  es.onerror = () => { /* EventSource 自带重连 */ };
}
boot();
